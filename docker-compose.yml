
services:
  db:
    image: postgres:16
    container_name: insightflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_this_password
      POSTGRES_DB: insightflow_db
    ports:
      - "5432:5432"
    volumes:
      - insightflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insightflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  insightflow_data:
